server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API, as in development (Vite proxy): /api/x -> api:8000/x
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
