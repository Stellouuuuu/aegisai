[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisai"
version = "0.1.0"
description = "AI Application Security Analyzer - black-box scanner for LLM apps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.scripts]
aegis = "engine.cli:main"

[project.optional-dependencies]
demo = ["fastapi", "uvicorn"]
api = ["fastapi", "uvicorn"]
pdf = ["reportlab>=4"]
dev = ["reportlab>=4", "fastapi", "httpx", "uvicorn", "pytest>=8", "pytest-cov", "ruff", "black", "mypy"]

[tool.setuptools.packages.find]
include = ["engine*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "vulnerable-lab"]

[tool.ruff]
line-length = 100
src = [".", "vulnerable-lab"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.black]
line-length = 100

[tool.mypy]
strict = true
