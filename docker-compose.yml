# One command to run everything:  docker compose up --build
#   dashboard  http://localhost:8080
#   API docs   http://localhost:8000/docs
#   lab        http://lab:8001/chat  (scan target, reachable from the API container)
#
# The lab is a deliberately vulnerable app. Host ports are bound to 127.0.0.1 only.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # The API refuses private targets (SSRF guard); allow only the bundled labs.
      AEGIS_ALLOWED_HOSTS: lab,lab-patched
    volumes:
      - aegis-data:/data
    depends_on:
      lab:
        condition: service_healthy

  dashboard:
    build: ./frontend
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:80"
    depends_on:
      - api

  lab:
    build: ./vulnerable-lab
    ports:
      - "127.0.0.1:8011:8001"
    environment:
      AEGIS_LAB_MODE: vulnerable
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Fixed variant, to check a retest: docker compose --profile compare up
  lab-patched:
    build: ./vulnerable-lab
    profiles: ["compare"]
    ports:
      - "127.0.0.1:8002:8001"
    environment:
      AEGIS_LAB_MODE: patched

volumes:
  aegis-data:
